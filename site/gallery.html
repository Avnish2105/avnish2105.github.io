    <nav class="navbar" aria-label="Main">
        <div class="nav-content">
            <a href="index.html" class="logo" aria-label="Avnish Deshmukh, home">AD</a>
            <div class="nav-links">
                <a href="index.html">Home</a>

                <a href="gallery.html" aria-current="page">Gallery</a>
            </div>
        </div>
    </nav>

    <main class="gallery-main">
        <div class="gallery-container">
            <h1 class="section-title">MIT Tech Team Gallery</h1>
            <p class="gallery-hint">Tap or click a photo to view it larger.</p>

            <!-- Competition Highlights -->
            <section class="gallery-section" aria-labelledby="g-highlights">
                <h2 id="g-highlights">Competition Highlights</h2>
                <div class="gallery-grid">
                    <button type="button" class="gallery-tile wide">
                        <img src="assets/images/gallery/robocon-2024-tyagraj-stadium.webp" alt="The Robocon competition arena at Tyagraj Stadium" width="1600" height="900" fetchpriority="high" decoding="async">
                        <span class="caption">Competition Arena at Tyagraj Stadium - Where dreams take flight</span>
                    </button>
                    <button type="button" class="gallery-tile">
                        <img src="assets/images/gallery/robocon-2024-team-trophy.webp" alt="MIT WPU-Tech Team celebrating with the trophy at Robocon 2024" width="1600" height="1200" loading="lazy" decoding="async">
                        <span class="caption">Celebrating our achievement at Robocon 2024</span>
                    </button>
                    <button type="button" class="gallery-tile">
                        <img src="assets/images/gallery/mtt-cheering.webp" alt="MIT Tech Team members cheering together" width="1600" height="1067" loading="lazy" decoding="async">
                        <span class="caption">The winning spirit of MIT Tech Team</span>
                    </button>
                </div>
            </section>

            <!-- Our Teams -->
            <section class="gallery-section" aria-labelledby="g-teams">
                <h2 id="g-teams">Our Dynamic Teams</h2>
                <div class="gallery-grid">
                    <button type="button" class="gallery-tile">
                        <img src="assets/images/gallery/robocon-2024-electronics-team.webp" alt="The electronics team, Robocon 2024" width="1600" height="1200" loading="lazy" decoding="async">
                        <span class="caption">Electronics Team - Powering our innovations</span>
                    </button>
                    <button type="button" class="gallery-tile">
                        <img src="assets/images/gallery/robocon-2024-control-team.webp" alt="The control team, Robocon 2024" width="1600" height="1200" loading="lazy" decoding="async">
                        <span class="caption">Control Team - Masters of precision</span>
                    </button>
                    <button type="button" class="gallery-tile">
                        <img src="assets/images/gallery/robocon-2024-mechanical-team.webp" alt="The mechanical team, Robocon 2024" width="1600" height="1200" loading="lazy" decoding="async">
                        <span class="caption">Mechanical Team - Building excellence</span>
                    </button>
                    <button type="button" class="gallery-tile">
                        <img src="assets/images/gallery/robocon-2024-non-tech-team.webp" alt="The non-tech team, Robocon 2024" width="1600" height="1079" loading="lazy" decoding="async">
                        <span class="caption">Non-Tech Team - The backbone of our success</span>
                    </button>
                </div>
            </section>

            <!-- Team Spirit -->
            <section class="gallery-section" aria-labelledby="g-spirit">
                <h2 id="g-spirit">Team Spirit</h2>
                <div class="gallery-grid split">
                    <button type="button" class="gallery-tile">
                        <img src="assets/images/gallery/robocon-2024-team.webp" alt="MIT Tech Team group photo, 2024" width="1600" height="1301" loading="lazy" decoding="async">
                        <span class="caption">United in purpose - MIT Tech Team 2024</span>
                    </button>
                    <button type="button" class="gallery-tile fill">
                        <img src="assets/images/gallery/robocon-2024-team-participants.webp" alt="Team members at Robocon 2024" width="1600" height="1200" loading="lazy" decoding="async">
                        <span class="caption">Our dedicated team members at Robocon 2024</span>
                    </button>
                </div>
            </section>

            <!-- Behind the Scenes -->
            <section class="gallery-section" aria-labelledby="g-behind">
                <h2 id="g-behind">Behind the Scenes</h2>
                <div class="gallery-grid split">
                    <div class="gallery-stack">
                        <button type="button" class="gallery-tile fill">
                        <img src="assets/images/gallery/robots-night-light.webp" alt="Robots during a late-night work session" width="1600" height="901" loading="lazy" decoding="async">
                        <span class="caption">Late night innovation sessions</span>
                    </button>
                        <button type="button" class="gallery-tile fill">
                        <img src="assets/images/gallery/robot-2023.webp" alt="The 2023 robot during testing" width="1600" height="1067" loading="lazy" decoding="async">
                        <span class="caption">Our 2023 Robot in testing</span>
                    </button>
                    </div>
                    <button type="button" class="gallery-tile tall">
                        <img src="assets/images/gallery/robocon-lab-outside.webp" alt="Outside the MIT-WPU Robocon Robotics Innovation Lab at sunset" width="1200" height="1600" loading="lazy" decoding="async">
                        <span class="caption">Our Robocon Lab - Home of innovation</span>
                    </button>
                </div>
            </section>
        </div>
    </main>

    <dialog class="lightbox" aria-label="Photo viewer">
        <figure>
            <img src="" alt="">
            <figcaption></figcaption>
        </figure>
        <button type="button" class="close-lightbox" aria-label="Close photo">&times;</button>
    </dialog>

    <footer>
        <p>&copy; 2026 Avnish Deshmukh. Building the future with code and robotics.</p>
